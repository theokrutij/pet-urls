<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; padding: 0;
      display: flex; flex-direction: column; height: 100vh;
      align-items: center; justify-content: center;
    }
    header {
      position: absolute;
      top: 0; width: 100%; padding: 1rem;
      background: #222; color: #eee;
      text-align: center;
      font-size: 1.5rem;
    }
    main {
      text-align: center;
    }
    input[type="text"] {
      width: 300px; padding: 0.5rem; font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem; font-size: 1rem;
      margin-left: 0.5rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1rem;
      font-weight: bold;
    }
    #result.error {
      color: red;
    }
    #result.success {
      color: green;
    }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input type="text" id="urlInput" placeholder="Enter URL" size="50">
  <button onclick="shortenURL()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shortenURL() {
      const input = document.getElementById('urlInput');
      const url = input.value;
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = ''; // Clear previous result

      try {
        const response = await fetch('/api/v1/short', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ original_url: url })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Invalid URL');
        }

        const data = await response.json();
        const link = document.createElement('a');
        link.href = data.short_url;
        link.textContent = data.short_url;
        link.target = '_blank';

        resultDiv.innerHTML = 'Short URL: ';
        resultDiv.appendChild(link);

        if (data.valid_until) {
          const localTime = new Date(data.valid_until).toLocaleString();
          const timeDiv = document.createElement('div');
          timeDiv.textContent = 'Valid until: ' + localTime;
          resultDiv.appendChild(timeDiv);
        }

      } catch (err) {
        resultDiv.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
