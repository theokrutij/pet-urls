# -------------------------------------------------------------------
# Development Docker Compose File
#
# Services:
# - Postgres (v17.5-alpine)
#   - Exposes port 5432
#   - Persists data using a named Docker volume (`postgres_data`)
#   - Logging level set to INFO, logs all SQL statements
#   - Healthcheck enabled using `pg_isready`
#
# - Redis (v8.0-alpine)
#   - Exposes port 6379
#   - Uses custom configuration file `redis.conf`
#
# Notes:
# - Both containers use official Alpine-based images for minimal size
# - Postgres restarts automatically unless manually stopped
# -------------------------------------------------------------------

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: postgres-dev
    shm_size: 128mb
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    command:
      - postgres
      - -c
      - log_min_messages=info
      - -c
      - log_statement=all

  redis: 
    image: redis:8.0-alpine
    container_name: redis-dev
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

    ports:
      - "6379:6379"

volumes:
  postgres_data:
